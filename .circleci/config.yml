version: 2.1

orbs:
  go: circleci/go@3.0.4

executors:
  node:
    docker:
      - image: cimg/node:24.15.0
  go:
    docker:
      - image: cimg/go:1.25.14

jobs:
  semantic_release:
    executor: node
    steps:
      - checkout
      - run:
          name: Install semantic-release and plugins
          command: |
            sudo npm install -g --no-audit --no-fund \
              semantic-release@25.0.9 \
              @semantic-release/commit-analyzer@13.0.1 \
              @semantic-release/release-notes-generator@14.1.1 \
              @semantic-release/changelog@7.0.0 \
              @semantic-release/git@11.0.1 \
              conventional-changelog-conventionalcommits@8.0.0
      - run:
          name: Configure git identity
          command: |
            git config user.name "witness-cli release bot"
            git config user.email "release-bot@lyssar.github.com"
      - run:
          name: Run semantic-release
          command: semantic-release

  release:
    executor: go
    steps:
      - checkout
      - go/install-goreleaser:
          version: v2.18.2
      - run:
          name: Publish GitHub release
          command: goreleaser release --clean

workflows:
  semantic-release:
    jobs:
      - semantic_release:
          context: release
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/

  publish:
    jobs:
      - release:
          context: release
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/