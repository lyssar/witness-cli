name: skuld-cli-local-harness

services:
  target:
    image: ${LOCAL_IMAGE:-skuld-cli-harness:latest}
    build:
      context: ../..
      dockerfile: docker/local-harness/Dockerfile
    working_dir: /workspace
    entrypoint: ["/usr/local/bin/skuld-cli"]
    volumes:
      - ${LOCAL_BIN_MOUNT_PATH:-../../.local/bin/skuld-cli}:/usr/local/bin/skuld-cli:ro
      - ${LOCAL_HOST_RUNTIME_ROOT:-../../.local/harness/runtime}:/workspace/harness/runtime
      - ${LOCAL_HOST_CONFIG_ROOT:-../../.local/harness/config}/manifest.yaml:/workspace/harness/runtime/manifest.yaml:ro
      - ${LOCAL_HOST_CONFIG_ROOT:-../../.local/harness/config}/age.key:/workspace/harness/runtime/age.key:ro
      - ${LOCAL_HOST_SOURCE_REPO:-../../.local/harness/source-repo}:/workspace/harness/source-repo:ro
