<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="repoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0808;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0000;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#cc0000" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc0000" />
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d4a017" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="900" fill="url(#bgGrad)" rx="8"/>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="18" fill="#cc0000" font-weight="bold" letter-spacing="4">SKULD RECONCILIATION PIPELINE</text>
  <line x1="100" y1="58" x2="700" y2="58" stroke="#331111" stroke-width="1"/>

  <!-- Phase labels -->
  <text x="55" y="105" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="11" fill="#666" letter-spacing="2">OBSERVE</text>
  <line x1="20" y1="115" x2="90" y2="115" stroke="#444" stroke-width="1"/>

  <text x="55" y="365" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="11" fill="#666" letter-spacing="2">PLAN</text>
  <line x1="20" y1="375" x2="90" y2="375" stroke="#444" stroke-width="1"/>

  <text x="55" y="615" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="11" fill="#666" letter-spacing="2">EXECUTE</text>
  <line x1="20" y1="625" x2="90" y2="625" stroke="#444" stroke-width="1"/>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- PHASE 1: OBSERVE                                       -->
  <!-- ════════════════════════════════════════════════════════ -->

  <!-- Git Repository Box -->
  <rect x="250" y="78" width="300" height="50" rx="4" fill="url(#repoGrad)" stroke="#cc0000" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="100" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="12" fill="#d4a017" font-weight="bold">GIT REPOSITORY</text>
  <text x="400" y="117" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="9" fill="#777">source of truth</text>

  <!-- Arrow: Git → Observer -->
  <line x1="400" y1="128" x2="400" y2="155" stroke="#cc0000" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- Observer Config Box -->
  <rect x="220" y="155" width="360" height="60" rx="4" fill="url(#boxGrad)" stroke="#555" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="176" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="12" fill="#cc0000">OBSERVER CONFIG</text>
  <text x="400" y="193" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="9" fill="#888">manifest.yaml + age.key</text>
  <text x="400" y="205" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="8" fill="#666">~/.config/skuld-cli/&lt;project&gt;/</text>

  <!-- Arrow: Observer → Sync -->
  <line x1="400" y1="215" x2="400" y2="245" stroke="#cc0000" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- PHASE 2: PLAN                                          -->
  <!-- ════════════════════════════════════════════════════════ -->

  <!-- 1. Sync -->
  <rect x="100" y="250" width="180" height="60" rx="4" fill="url(#boxGrad)" stroke="#666" stroke-width="1" filter="url(#shadow)"/>
  <text x="190" y="274" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="12" fill="#e53935" font-weight="bold">1. GIT SYNC</text>
  <text x="190" y="291" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="9" fill="#888">clone / fetch</text>

  <!-- 2. Discover -->
  <rect x="310" y="250" width="180" height="60" rx="4" fill="url(#boxGrad)" stroke="#666" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="274" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="12" fill="#e53935" font-weight="bold">2. DISCOVER</text>
  <text x="400" y="291" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="9" fill="#888">find skuld.yaml files</text>

  <!-- 3. Stage -->
  <rect x="520" y="250" width="180" height="60" rx="4" fill="url(#boxGrad)" stroke="#666" stroke-width="1" filter="url(#shadow)"/>
  <text x="610" y="274" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="12" fill="#e53935" font-weight="bold">3. STAGE</text>
  <text x="610" y="291" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="9" fill="#888">decrypt secrets</text>

  <!-- Arrows between plan boxes -->
  <line x1="280" y1="280" x2="308" y2="280" stroke="#d4a017" stroke-width="1.5" marker-end="url(#arrowGold)"/>
  <line x1="490" y1="280" x2="518" y2="280" stroke="#d4a017" stroke-width="1.5" marker-end="url(#arrowGold)"/>

  <!-- Arrow: Sync → Diff (below) -->
  <line x1="190" y1="310" x2="340" y2="345" stroke="#cc0000" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- Arrow: Stage → Diff (below) -->
  <line x1="610" y1="310" x2="460" y2="345" stroke="#cc0000" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- State Store (between plan and diff) -->
  <rect x="530" y="330" width="170" height="45" rx="4" fill="#0d0d0d" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="615" y="350" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="10" fill="#888">STATE STORE</text>
  <text x="615" y="365" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="9" fill="#666">state.json</text>

  <!-- Arrow: Store → Diff -->
  <line x1="530" y1="352" x2="475" y2="352" stroke="#666" stroke-width="1" marker-end="url(#arrowRed)" stroke-dasharray="4,3"/>

  <!-- 4. Diff -->
  <rect x="270" y="355" width="210" height="55" rx="4" fill="url(#boxGrad)" stroke="#d4a017" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="375" y="378" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="12" fill="#d4a017" font-weight="bold">4. DRIFT DETECTION</text>
  <text x="375" y="395" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="9" fill="#888">compare staged vs. running</text>

  <!-- Arrow: Diff → Apply -->
  <line x1="375" y1="410" x2="375" y2="445" stroke="#d4a017" stroke-width="1.5" marker-end="url(#arrowGold)"/>

  <!-- Decision diamond -->
  <polygon points="375,445 425,470 375,495 325,470" fill="#1a1a1a" stroke="#d4a017" stroke-width="1.5"/>
  <text x="375" y="473" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="9" fill="#d4a017">DRIFT?</text>

  <!-- Arrow: No drift → skip -->
  <line x1="425" y1="470" x2="700" y2="470" stroke="#446644" stroke-width="1" marker-end="url(#arrowRed)"/>
  <text x="570" y="464" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="9" fill="#446644">no drift → skip</text>

  <!-- Arrow: Drift → Apply -->
  <line x1="375" y1="495" x2="375" y2="530" stroke="#cc0000" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- PHASE 3: EXECUTE                                       -->
  <!-- ════════════════════════════════════════════════════════ -->

  <!-- 5. Apply -->
  <rect x="100" y="535" width="550" height="65" rx="4" fill="url(#boxGrad)" stroke="#cc0000" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="375" y="558" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="14" fill="#cc0000" font-weight="bold">5. APPLY</text>
  <text x="375" y="578" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="10" fill="#888">create / update / delete applications</text>

  <!-- Apply sub-boxes -->
  <rect x="120" y="592" width="160" height="28" rx="3" fill="#111" stroke="#555" stroke-width="0.5"/>
  <text x="200" y="611" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="9" fill="#aaa">docker compose up</text>

  <rect x="320" y="592" width="160" height="28" rx="3" fill="#111" stroke="#555" stroke-width="0.5"/>
  <text x="400" y="611" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="9" fill="#aaa">docker compose down</text>

  <rect x="520" y="592" width="110" height="28" rx="3" fill="#111" stroke="#555" stroke-width="0.5"/>
  <text x="575" y="611" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="9" fill="#aaa">scrub secrets</text>

  <!-- Arrow: Apply → Destination -->
  <line x1="375" y1="625" x2="375" y2="655" stroke="#cc0000" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- Destination Box -->
  <rect x="200" y="660" width="350" height="55" rx="4" fill="url(#repoGrad)" stroke="#cc0000" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="375" y="683" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="12" fill="#ddd">DESTINATION</text>
  <text x="375" y="700" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="9" fill="#888">/var/lib/skuld/destination/apps/&lt;app&gt;/</text>

  <!-- Arrow: Destination → Running -->
  <line x1="375" y1="715" x2="375" y2="745" stroke="#cc0000" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- Running Containers -->
  <rect x="180" y="750" width="390" height="55" rx="4" fill="url(#boxGrad)" stroke="#d4a017" stroke-width="1" filter="url(#shadow)"/>
  <text x="375" y="773" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="12" fill="#d4a017">RUNNING CONTAINERS</text>
  <text x="375" y="790" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="9" fill="#888">hello_web_1  hello_db_1  hello_api_1</text>

  <!-- Legend -->
  <text x="60" y="845" font-family="'Share Tech Mono', monospace" font-size="9" fill="#555">LEGEND:</text>
  <rect x="120" y="835" width="12" height="12" rx="2" fill="none" stroke="#cc0000" stroke-width="1.5"/>
  <text x="138" y="845" font-family="'Share Tech Mono', monospace" font-size="9" fill="#777">core pipeline</text>
  <rect x="230" y="835" width="12" height="12" rx="2" fill="none" stroke="#d4a017" stroke-width="1.5"/>
  <text x="248" y="845" font-family="'Share Tech Mono', monospace" font-size="9" fill="#777">plan / insight</text>
  <line x1="340" y1="841" x2="360" y2="841" stroke="#666" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="366" y="845" font-family="'Share Tech Mono', monospace" font-size="9" fill="#777">data read</text>

  <!-- Footer -->
  <text x="400" y="880" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="10" fill="#331111" letter-spacing="3">☥ PEACE THROUGH POWER ☥</text>
</svg>
